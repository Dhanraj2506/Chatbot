server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed files never change → browser may cache them for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html must always be fresh so users get the new deploy
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: unknown paths (e.g. /chat/123) → index.html, React handles routing
  location / {
    try_files $uri /index.html;
  }
}