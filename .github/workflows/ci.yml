# @format

name: CI

on:
  push:
    branches: [main]
  pull_request: # runs on every PR, to any branch

jobs:
  build:
    runs-on: ubuntu-latest # free Linux machine from GitHub
    steps:
      - uses: actions/checkout@v4 # git clone
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # caches ~/.npm between runs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker build -t chatbot-cicd:${{ github.sha }} .
